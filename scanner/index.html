<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>UEB Smart OMR Scanner</title>
  <meta name="theme-color" content="#F2F2F7" />
  <link rel="icon" type="image/png" href="icon-180.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #F2F2F7;
      --card: rgba(255, 255, 255, 0.94);
      --text: #1C1C1E;
      --muted: #6E6E73;
      --primary: #007AFF;
      --primary-dark: #0056B3;
      --danger: #FF3B30;
      --border: rgba(60, 60, 67, 0.14);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body.ueb-gate-body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top left, #DCEBFF 0%, #F2F2F7 48%, #ECEBFF 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .gate-card {
      width: 100%;
      max-width: 410px;
      background: var(--card);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-radius: 24px;
      padding: 28px 24px 24px;
      border: 0.5px solid var(--border);
      box-shadow: 0 18px 46px rgba(10, 77, 140, 0.14);
      text-align: center;
    }
    .logo-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 122, 255, 0.10);
      color: var(--primary);
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 5px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .sub {
      margin: 0 0 18px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .pwd-wrap {
      position: relative;
      margin-bottom: 11px;
    }
    .pwd-input {
      width: 100%;
      padding: 13px 46px 13px 14px;
      border-radius: 13px;
      border: 1.5px solid rgba(60, 60, 67, 0.18);
      background: #F9F9FB;
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .pwd-input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.14);
    }
    .eye-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 12.5px;
      color: var(--muted);
      text-align: left;
    }
    .remember-row label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text);
    }
    .submit-btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 122, 255, 0.28);
      transition: transform 0.08s ease, opacity 0.15s ease;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.65; cursor: wait; }
    .err-msg {
      display: none;
      margin-top: 11px;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(255, 59, 48, 0.10);
      color: #C91C1C;
      font-size: 12.5px;
      font-weight: 600;
    }
    .hint {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 0.5px solid var(--border);
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.45;
    }
    .auto-loading {
      display: none;
      padding: 20px 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
    }
  </style>
</head>
<body class="ueb-gate-body">
  <div class="gate-card">
    <div class="logo-wrap">
      <img src="icon-180.png" alt="Logo VNU-UEB" />
    </div>
    <div class="badge">🔒 Bảo Mật AES-256-GCM • Nội Bộ VNU-UEB</div>
    <h1>UEB Smart OMR Scanner</h1>

    <div id="autoLoadingBox" class="auto-loading">Đang tự động mở khóa phiên đã đăng nhập...</div>

    <form id="unlockForm" onsubmit="handleUnlockSubmit(event)">
      <div class="pwd-wrap">
        <input type="password" id="pwdInput" class="pwd-input" autocomplete="current-password" placeholder="Nhập mật khẩu truy cập..." required />
        <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePwdVis()">Hiện</button>
      </div>
      <div class="remember-row">
        <label>
          <input type="checkbox" id="rememberChk" checked />

        </label>
      </div>
      <button type="submit" class="submit-btn" id="unlockBtn">Mở Khóa Truy Cập</button>
      <div id="errBox" class="err-msg"></div>
    </form>

    <div class="hint">Liên hệ giảng viên quản trị để được cấp mật khẩu truy cập.</div>
  </div>

    const SESSION_KEY = "ueb_omr_vault_session_v1";
    const PILL_BOTTOM = "74px";

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function togglePwdVis() {
      const inp = document.getElementById("pwdInput");
      const btn = document.getElementById("eyeBtn");
      if (inp.type === "password") {
        inp.type = "text";
        btn.textContent = "Ẩn";
      } else {
        inp.type = "password";
        btn.textContent = "Hiện";
      }
    }

    function showErr(msg) {
      const el = document.getElementById("errBox");
      el.textContent = msg;
      el.style.display = "block";
    }

    async function deriveKek(password) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw",
        enc.encode(password.trim()),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: b64ToBytes(VAULT.salt),
          iterations: VAULT.iters,
          hash: "SHA-256"
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function unlockVaultWithPassword(password) {
      const kek = await deriveKek(password);
      const dec = new TextDecoder();
      for (let i = 0; i < VAULT.slots.length; i++) {
        const slot = VAULT.slots[i];
        try {
          const plainBuf = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: b64ToBytes(slot.iv) },
            kek,
            b64ToBytes(slot.w)
          );
          const sessionObj = JSON.parse(dec.decode(plainBuf));
          sessionObj.buildId = VAULT.buildId;
          return sessionObj;
        } catch (e) {}
      }
      return null;
    }

    function buildInjectedSessionHtml(sessionObj) {
      const safeName = String(sessionObj.name || "Giảng viên UEB")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      const bootScript =
        "<script>" +
        "window.__UEB_MCK_B64__=" + JSON.stringify(sessionObj.mck) + ";" +
        "window.__UEB_ACCESS_TOKEN__=" + JSON.stringify(sessionObj.apiKey || "") + ";" +
        "window.__UEB_ACCESS_USER__=" + JSON.stringify(sessionObj.name || "") + ";" +
        "window.__UEB_ACCESS_ROLE__=" + JSON.stringify(sessionObj.role || "") + ";" +
        "window.__uebSignOut=function(){" +
        "try{localStorage.removeItem(" + JSON.stringify(SESSION_KEY) + ");}catch(e){}" +
        "try{sessionStorage.removeItem(" + JSON.stringify(SESSION_KEY) + ");}catch(e){}" +
        "location.reload();" +
        "};" +
        "<\/script>";

      const lockPill =
        '<div id="uebAuthFloatPill" style="position:fixed;right:10px;bottom:' + PILL_BOTTOM + ';z-index:9999;display:inline-flex;align-items:center;gap:6px;background:rgba(28,28,30,0.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,0.22);font-family:-apple-system,BlinkMacSystemFont,sans-serif;">' +
        '<span>👤 ' + safeName + '</span>' +
        '<button type="button" onclick="window.__uebSignOut()" style="border:none;background:rgba(255,59,48,0.92);color:#fff;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;">🔒 Khóa</button>' +
        '</div>';

      return { bootScript, lockPill };
    }

    async function decryptAndMountPage(sessionObj) {
      const mckBytes = b64ToBytes(sessionObj.mck);
      const mckKey = await crypto.subtle.importKey(
        "raw",
        mckBytes,
        { name: "AES-GCM" },
        false,
        ["decrypt"]
      );
      const plainBuf = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(PAYLOAD.iv) },
        mckKey,
        b64ToBytes(PAYLOAD.ct)
      );
      let html = new TextDecoder().decode(plainBuf);
      const inj = buildInjectedSessionHtml(sessionObj);
      if (html.includes("<head>")) {
        html = html.replace("<head>", "<head>" + inj.bootScript);
      } else {
        html = inj.bootScript + html;
      }
      if (html.includes("</body>")) {
        html = html.replace("</body>", inj.lockPill + "</body>");
      } else {
        html = html + inj.lockPill;
      }
      document.documentElement.innerHTML = "";
      document.open("text/html", "replace");
      document.write(html);
      document.close();
    }

    async function handleUnlockSubmit(ev) {
      ev.preventDefault();
      const btn = document.getElementById("unlockBtn");
      const pwd = document.getElementById("pwdInput").value;
      const remember = document.getElementById("rememberChk").checked;
      document.getElementById("errBox").style.display = "none";

      if (!window.crypto || !window.crypto.subtle) {
        showErr("Trình duyệt không hỗ trợ Web Crypto (Hãy mở bằng HTTPS hoặc Safari/Chrome mới nhất).");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Đang xác thực & giải mã...";
      try {
        const sessionObj = await unlockVaultWithPassword(pwd);
        if (!sessionObj) {
          showErr("Mật khẩu truy cập không đúng hoặc đã bị thu hồi!");
          btn.disabled = false;
          btn.textContent = "Mở Khóa Truy Cập";
          document.getElementById("pwdInput").select();
          return;
        }
        const serialized = JSON.stringify(sessionObj);
        try { sessionStorage.setItem(SESSION_KEY, serialized); } catch (e) {}
        if (remember) {
          try { localStorage.setItem(SESSION_KEY, serialized); } catch (e) {}
        } else {
          try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
        }
        await decryptAndMountPage(sessionObj);
      } catch (err) {
        showErr("Lỗi giải mã: " + (err && err.message ? err.message : err));
        btn.disabled = false;
        btn.textContent = "Mở Khóa Truy Cập";
      }
    }

    async function tryAutoUnlock() {
      let raw = null;
      try { raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY); } catch (e) {}
      if (!raw) {
        document.getElementById("pwdInput")?.focus();
        return;
      }
      try {
        const saved = JSON.parse(raw);
        if (!saved || !saved.mck || saved.buildId !== VAULT.buildId) {
          try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
          document.getElementById("pwdInput")?.focus();
          return;
        }
        document.getElementById("unlockForm").style.display = "none";
        document.getElementById("autoLoadingBox").style.display = "block";
        await decryptAndMountPage(saved);
      } catch (e) {
        try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (err) {}
        document.getElementById("autoLoadingBox").style.display = "none";
        document.getElementById("unlockForm").style.display = "block";
        document.getElementById("pwdInput")?.focus();
      }
    }

    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && true) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    window.addEventListener("DOMContentLoaded", () => setTimeout(tryAutoUnlock, 0));
  </script>
</body>
</html>
